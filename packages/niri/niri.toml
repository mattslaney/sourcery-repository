name = "Niri"
desc = "A scrollable-tiling Wayland compositor"
repo = [ "https://github.com/YaLTeR/niri.git" ]
branch = "main"
type = "compositor"
categories = [ "wayland", "compositor" ]

[build]
dependencies = [ "cargo", "rustc" ]
command = '''
cargo build --release
'''
artifacts = [ 
    "target/release/niri",
    "resources/niri-session",
    "resources/niri.desktop",
    "resources/niri.desktop",
    "resources/niri.service",
    "resources/niri-shutdown.target",
    "resources/dinit/niri",
    "resources/dinit/niri-shutdown",
]

[install]
scope = [ "system" ]
prerequisites = [ "build" ]
command = '''
mkdir -p /usr/share/wayland-sessions
cp $SCRY_ARTIFACTS/target/release/niri /usr/local/bin/niri
cp $SCRY_ARTIFACTS/resources/niri-session /usr/share/wayland-sessions/niri-session
cp $SCRY_ARTIFACTS/resources/niri.desktop /usr/share/wayland-sessions/niri.desktop
chmod +x /usr/local/niri
chmod +x /usr/share/wayland-sessions/niri-session
if [ -d /etc/systemd ]; then
    cp $SCRY_ARTIFACTS/resources/niri.service /etc/systemd/system/niri.service
    cp $SCRY_ARTIFACTS/resources/niri-shutdown.target /etc/systemd/system/niri-shutdown.target
fi
if [ -d /etc/dinit ]; then
    cp $SCRY_ARTIFACTS/resources/dinit/niri /etc/dinit.d/niri
    cp $SCRY_ARTIFACTS/resources/dinit/niri-shutdown /etc/dinit.d/niri-shutdown
fi
'''

[update]
prerequisites = [ "uninstall", "build", "install" ]

[uninstall]
command = '''
rm -f /usr/local/niri
rm -f /usr/share/wayland-sessions/niri-session
rm -f /usr/share/wayland-sessions/niri.desktop
rm -f /etc/systemd/system/niri.service
rm -f /etc/systemd/system/niri-shutdown.target
rm -f /etc/dinit.d/niri
rm -f /etc/dinit.d/niri-shutdown
'''

[purge]
prerequisites = [ "uninstall" ]
command = '''
rm -rf ~/.config/niri
rm -rf ~/.local/share/niri
rm -rf ~/.cache/niri
'''